  }).join("");
  return `<div class="tablewrap"><table><thead><tr><th>Player</th>${head}<th>Total</th><th>Wins</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="note">Maroon marks the winner of each game. Lowest total wins the match. Ties go to the player with more game wins.</div>`;
}
function teamNames(g,t){ return [g.players[t].name, g.players[t+2].name].map(esc).join(" &amp; "); }
function courtScoresHTML(V){
  const g = V.g;
  const rows = g.hlog.map((h,k)=>`<tr><td>${k+1}</td><td class="${RED[h.trump]?"":""}">${SUITS[h.trump]}</td><td>${h.tricks[0]}</td><td>${h.tricks[1]}</td><td class="win">${h.team===0?"A":"B"} +${h.pts}${h.court?" Court":""}</td></tr>`).join("");
  return `<div class="tablewrap"><table><thead><tr><th>Hand</th><th>Trump</th><th>A tricks</th><th>B tricks</th><th>Point</th></tr></thead><tbody>${rows || `<tr><td colspan="5" class="note">No hands finished yet</td></tr>`}
    <tr class="lead"><td>Total</td><td></td><td></td><td></td><td class="tot">A ${g.score[0]} · B ${g.score[1]}</td></tr></tbody></table></div>
  <div class="note">Team A: ${teamNames(g,0)}. Team B: ${teamNames(g,1)}. First to ${g.target} points wins.</div>`;
}
function handHTML(hand, myTurn, okFn, hintsOn){
  return hand.map(c=>{
    const ok = myTurn && okFn(c);
    return cardHTML(c, (myTurn && hintsOn ? (ok?"ok":"dim") : "") + (S.selected===c?" sel":""), `data-card="${c}"`);
  }).join("");
}
function renderGame(V){
  const g = V.g, me = V.me, N = g.players.length;
  const myTurn = g.phase==="playing" && g.turn===me;
  const hand = g.myHand;
  const playable = hand.filter(c=>legal(g.table,c));
  const hints = CFG.hints;
  if (S.selected!=null && !(myTurn && (hints ? playable.includes(S.selected) : hand.includes(S.selected)))) S.selected = null;
  const t = totals(g), w = wins(g), order = standings(g);
  const rank = g.rounds.length ? order.indexOf(me)+1 : "–";
  const opps = Array.from({length:N-1},(_,k)=>(me+1+k)%N).map(i=>`
    <div class="opp ${g.phase==="playing"&&g.turn===i?"turn":""}">
      <div class="n">${esc(g.players[i].name)}${V.seats[i]&&!V.seats[i].online?" (offline)":""}</div>
      <div class="c">${g.counts[i]} cards · ${t[i]} pts</div>
      <div class="fan" aria-hidden="true">${Array.from({length:g.counts[i]},()=>"<i></i>").join("")}</div>
    </div>`).join("");
  const lanes = [0,1,2,3].map(s=>{
    const tb = g.table[s];
    const cells = Array.from({length:13},(_,k)=>{
      const r = k+1, on = tb.lo && r>=tb.lo && r<=tb.hi, isNew = on && g.last===s*13+k;
      return `<div class="cell ${on?"on":""} ${RED[s]?"red":""} ${r===7?"seven":""} ${isNew?"new":""}">${on ? `${RANKS[k]}<small>${SUITS[s]}</small>` : RANKS[k]}</div>`;
    }).join("");
    return `<div class="lane"><div class="s ${RED[s]?"red":""}">${SUITS[s]}</div>${cells}</div>`;
  }).join("");
  let banner;
  if (g.phase!=="playing") banner = "Game over";
  else if (myTurn) banner = !hints ? "Your turn" : playable.length ? "Your turn. Pick a card" : "Your turn. No playable card";
  else banner = `Waiting for ${esc(g.players[g.turn].name)}`;
  const playBtn = `<button class="btn" id="play" ${S.selected==null?"disabled":""}>${S.selected==null?"Select a card":"Play "+lab(S.selected)}</button>`;
  const passBtn = `<button class="btn ${hints?"":"ghost"}" id="pass">Pass${g.penalty?` (+${g.penalty} pts)`:""}</button>`;
  const act_ = myTurn ? `<div class="actions">${!hints ? playBtn + passBtn : (playable.length ? playBtn : passBtn)}</div>` : "";
  const cw = fitCW(hand.length);
  return `
  <div class="top"><div class="brand">Badam Sat</div><span class="chip">Game <b>${Math.min(g.round,g.total)}</b> of ${g.total}</span><span class="chip" id="net" aria-label="Connection">…</span></div>
  <div class="top"><button class="btn ghost small" id="scores">Scoreboard</button>${chatBtn()}<button class="btn ghost small" id="settings">Settings</button><span style="margin-left:auto"></span><button class="btn ghost small" id="leave">Leave</button></div>
  <div class="opps">${opps}</div>
  <div class="banner ${myTurn?"me":""}">${banner}</div>
  <div class="board" role="group" aria-label="Table">${lanes}</div>
  <details class="log" id="logbox" ${S.logOpen?"open":""}><summary>Game log · Room ${esc(V.code)}</summary><div class="logl">${g.log.map(l=>`<div>${esc(l)}</div>`).join("")}</div></details>
  <div class="dock">
    <div class="mescore compact" aria-label="Your score"><span><b>${t[me]}</b>pts</span><span><b>${rank}</b>of ${N}</span><span><b>${w[me]}</b>wins</span><span><b>${hand.length}</b>cards</span></div>
    ${act_}
    <div class="hand" style="--cw:${cw}px">${handHTML(hand, myTurn, c=>playable.includes(c), hints) || `<span class="note">No cards left</span>`}</div>
  </div>`;
}
function renderCourt(V){
  const g = V.g, me = V.me, myTeam = me % 2;
  const myTurn = g.phase==="play" && !g.resolving && g.turn===me;
  const chooseMe = g.phase==="trump" && g.chooser===me;
  const canDeal = (g.phase==="deal" || g.phase==="handEnd") && (g.dealTeam===null || g.dealTeam===myTeam);
  const hand = g.myHand, hints = CFG.hints;
  const legalSet = new Set(hand.filter(c=>legalCourt(hand, g.trick, c)));
  if (S.selected!=null && !(myTurn && (hints ? legalSet.has(S.selected) : hand.includes(S.selected)))) S.selected = null;
  const us = g.tricks[me] + g.tricks[(me+2)%4], them = g.tricks[(me+1)%4] + g.tricks[(me+3)%4];
  const area = ["3 / 2","2 / 1","1 / 2","2 / 3"];
  const slots = [0,1,2,3].map(rel=>{
    const p = (me+rel)%4, tc = g.trick.find(x=>x.p===p);
    const isTurn = g.phase==="play" && !g.resolving && g.turn===p, isWin = g.resolving && g.trickWinner===p;
    return `<div class="tslot ${isTurn?"turn":""} ${isWin?"win":""}" style="grid-area:${area[rel]}"><span class="nm">${esc(g.players[p].name)}${p===me?" (you)":p===(me+2)%4?" · partner":""}</span>${tc ? cardHTML(tc.c,"mini","") : `<div class="tempty"></div>`}<span class="cnt">${g.counts[p]} card${g.counts[p]===1?"":"s"}</span></div>`;
  }).join("");
  const tn = t => t ? "B" : "A";
  let banner;
  if (g.phase==="deal") banner = "Any player can shuffle and deal the first hand";
  else if (g.phase==="handEnd") banner = canDeal ? "Your team shuffles and deals" : `Team ${tn(g.dealTeam)} shuffles and deals`;
  else if (g.phase==="trump") banner = chooseMe ? "Choose the trump suit" : `${esc(g.players[g.chooser].name)} is choosing the trump suit`;
  else if (g.phase==="play"){
    if (g.resolving) banner = `${esc(g.players[g.trickWinner].name)} wins the trick`;
    else if (myTurn) banner = g.trick.length ? (hints ? "Your turn. Follow the suit led if you can" : "Your turn") : "Your turn. Lead any card";
    else banner = `Waiting for ${esc(g.players[g.turn].name)}`;
  } else banner = "Hand over";
  const handCards = handHTML(hand, myTurn, c=>legalSet.has(c), hints);
  const playBtn = `<div class="actions"><button class="btn" id="play" ${S.selected==null?"disabled":""}>${S.selected==null?"Select a card":"Play "+lab(S.selected)}</button></div>`;
  const dealBtn = `<div class="actions"><button class="btn gold" id="cdeal">Shuffle &amp; deal</button></div>`;
  const pick = chooseMe ? `<div class="note">Look at your first 5 cards, then pick the trump. Trumps beat every other suit.</div><div class="suitpick">${[0,1,2,3].map(x=>`<button data-trump="${x}" class="${RED[x]?"red":""}" aria-label="Trump ${SUITS[x]}">${SUITS[x]}</button>`).join("")}</div>`
    : (g.phase==="deal" && canDeal ? dealBtn : (myTurn ? playBtn : ""));
  const cw = fitCW(hand.length);
  const trumpTxt = g.trump >= 0 ? `<b style="color:${RED[g.trump]?"#ffaaa4":"#fff"}">${SUITS[g.trump]}</b>` : `<b>?</b>`;
  return `
  <div class="top"><div class="brand">Court Piece</div><span class="chip">Hand <b>${g.hand}</b></span><span class="chip" id="net" aria-label="Connection">…</span></div>
  <div class="top"><button class="btn ghost small" id="scores">Scoreboard</button>${chatBtn()}<button class="btn ghost small" id="settings">Settings</button><span style="margin-left:auto"></span><button class="btn ghost small" id="leave">Leave</button></div>
  <div class="cscore">
    <div class="team me"><small>Your team</small><b>${g.score[myTeam]}</b><span class="nm">${teamNames(g,myTeam)}</span></div>
    <div class="vs">First to<br>${g.target}</div>
    <div class="team"><small>Opponents</small><b>${g.score[1-myTeam]}</b><span class="nm">${teamNames(g,1-myTeam)}</span></div>
  </div>
  <div class="chipsrow"><span class="chip">Tricks: your team <b>${us}</b> · them <b>${them}</b></span><span class="chip">Dealer: ${g.dealer>=0?esc(g.players[g.dealer].name):"not yet"}</span></div>
  <div class="banner ${(myTurn||chooseMe||canDeal)?"me":""}">${banner}</div>
  <div class="ttable" role="group" aria-label="Table">${slots}<div class="tcenter">Trump${trumpTxt}</div></div>
  <details class="log" id="logbox" ${S.logOpen?"open":""}><summary>Game log · Room ${esc(V.code)}</summary><div class="logl">${g.log.map(l=>`<div>${esc(l)}</div>`).join("")}</div></details>
  <div class="dock">
    ${pick}
    ${hand.length ? `<div class="hand" style="--cw:${cw}px">${handCards}</div>` : ""}
  </div>`;
}
function renderOverlay(V){
  if (S.settingsOpen) return settingsHTML();
  if (!V || !V.g) return "";
  const g = V.g;
  if (GAMES[V.kind]){
    const o = GAMES[V.kind].overlay(V); if (o) return o;
    if (S.scoresOpen) return `<div class="veil"><div class="sheet" role="dialog" aria-label="Scores"><h2>Scoreboard</h2>${GAMES[V.kind].scores(V)}<button class="btn" id="closescores">Close</button></div></div>`;
    return "";
  }
  if (V.kind === "court"){
    if (g.phase==="matchEnd"){
      const wt = g.score[0] >= g.target ? 0 : 1;
      return `<div class="veil"><div class="sheet" role="dialog" aria-label="Final result">
        <div class="champ"><div class="note">Match over</div><h2>${teamNames(g,wt)} win${""}</h2><div>Team ${wt===0?"A":"B"} · ${g.score[wt]} points</div></div>
        ${courtScoresHTML(V)}
        <button class="btn" id="cnewmatch">Play a new match</button>
        <button class="btn ghost" id="leave2">Leave room</button></div></div>`;
    }
    const canDeal = g.phase==="handEnd" && g.dealTeam === V.me % 2;
    if (g.phase==="handEnd" && S.dismissed!==g.hand){
      const h = g.hlog[g.hlog.length-1];
      return `<div class="veil"><div class="sheet" role="dialog" aria-label="Hand result">
        <h2>${teamNames(g,h.team)} won hand ${g.hand}${h.court?" with a Court":""}</h2>
        <div class="note">Tricks: Team A ${h.tricks[0]}, Team B ${h.tricks[1]}. Trump was ${SUITS[h.trump]}. +${h.pts} point${h.pts===1?"":"s"}.</div>
        ${courtScoresHTML(V)}
        ${canDeal ? `<div class="note">Your team lost this hand, so you shuffle and deal.</div><button class="btn gold" id="cdeal">Shuffle &amp; deal hand ${g.hand+1}</button>`
                  : `<div class="note">Team ${g.dealTeam?"B":"A"} lost this hand, so they shuffle and deal hand ${g.hand+1}.</div>`}
        <button class="btn ghost" id="hide">Look at the table</button></div></div>`;
    }
    if (g.phase==="handEnd") return canDeal ? `<div style="position:fixed;top:10px;left:0;right:0;display:flex;justify-content:center;z-index:5"><button class="btn gold" id="cdeal">Shuffle &amp; deal hand ${g.hand+1}</button></div>` : "";
    if (S.scoresOpen) return `<div class="veil"><div class="sheet" role="dialog" aria-label="Scores"><h2>Scoreboard</h2>${courtScoresHTML(V)}<button class="btn" id="closescores">Close</button></div></div>`;
    return "";
  }
  if (g.phase==="matchEnd"){
    const ord = standings(g), t = totals(g), w = wins(g);
    const top = ord.filter(i=>t[i]===t[ord[0]] && w[i]===w[ord[0]]);
    const title = top.length>1 ? `Shared win: ${top.map(i=>esc(g.players[i].name)).join(" & ")}` : `${esc(g.players[ord[0]].name)} wins the match`;
    return `<div class="veil"><div class="sheet" role="dialog" aria-label="Final result">
      <div class="champ"><div class="note">After ${g.total} games</div><h2>${title}</h2><div>${t[ord[0]]} points · ${w[ord[0]]} game win${w[ord[0]]===1?"":"s"}</div></div>
      ${scoresHTML(V)}
      <button class="btn" id="newmatch">Play a new match</button>
      <button class="btn ghost" id="leave2">Leave room</button></div></div>`;
  }
  if (g.phase==="roundEnd" && S.dismissed!==g.round){
    const r = g.rounds[g.rounds.length-1];
    return `<div class="veil"><div class="sheet" role="dialog" aria-label="Game result">
      <h2>${esc(g.players[r.winner].name)} won game ${g.round}</h2>${scoresHTML(V)}
      <button class="btn" id="nextgame">Deal game ${g.round+1}</button>
      <button class="btn ghost" id="hide">Look at the table</button></div></div>`;
  }
  if (g.phase==="roundEnd") return `<div style="position:fixed;top:10px;left:0;right:0;display:flex;justify-content:center;z-index:5"><button class="btn" id="nextgame">Deal game ${g.round+1}</button></div>`;
  if (S.scoresOpen) return `<div class="veil"><div class="sheet" role="dialog" aria-label="Scores"><h2>Scoreboard</h2>${scoresHTML(V)}<button class="btn" id="closescores">Close</button></div></div>`;
  return "";
}
let lastG = 0;
function render(){
  const app = $("#app"), ov = $("#overlay"), V = S.V;
  const stage = stageOf(V);
  if (stage !== lastG){ S.dismissed = 0; lastG = stage; }
  const typing = S.settingsOpen && ov.contains(document.activeElement) && document.activeElement.tagName === "INPUT";
  app.className = V && V.g ? "ingame" : "";
  if (!S.role){
    app.innerHTML = S.setup ? renderSetup() : renderHome();
    if (!typing) ov.innerHTML = S.settingsOpen ? settingsHTML() : "";
    return;
  }
  const status = S.status ? `<div class="status">${esc(S.status)}</div>` : "";
  if (!V){
    app.innerHTML = (status || `<div class="panel"><div class="note">Opening room…</div></div>`) + `<button class="btn ghost" id="leave">Back</button>`;
    if (!typing) ov.innerHTML = S.settingsOpen ? settingsHTML() : "";
    return;
  }
  const g = V.g, court = V.kind === "court";
  const mine = !!(g && myTurnNow(V));
  if (mine && !S.wasMyTurn) notifyTurn();
  if (!mine && S.wasMyTurn) document.title = baseTitle;
  S.wasMyTurn = mine;
  app.innerHTML = status + (g ? (court ? renderCourt(V) : GAMES[V.kind] ? GAMES[V.kind].render(V) : renderGame(V)) : renderLobby(V));
  updateNet();
  if (!typing) ov.innerHTML = renderOverlay(V);
}

/* ================= events ================= */
let resizeT = null, lastFit = 0;
window.addEventListener("resize", ()=>{
  clearTimeout(resizeT);
  resizeT = setTimeout(()=>{ if (S.role && S.V && S.V.g){ const f = fitCW(13); if (f !== lastFit){ lastFit = f; render(); } } }, 200);
});
document.addEventListener("click", e=>{
  const el = e.target.closest("button"); if (!el) return;
  const id = el.id;
  if (el.dataset.card != null){
    const n = Number(el.dataset.card), V = S.V, g = V && V.g;
    if (!g) return;
    const court = V.kind === "court";
    if (court){
      if (g.phase==="play" && !g.resolving && g.turn===V.me){
        if (!CFG.hints || legalCourt(g.myHand, g.trick, n)){ S.selected = S.selected===n ? null : n; render(); }
        else toast("Follow the suit that was led.");
      }
    } else if (g.phase==="playing" && g.turn===V.me){
      if (!CFG.hints || legal(g.table,n)){ S.selected = S.selected===n ? null : n; render(); }
      else toast("That card cannot be played now.");
    }
    return;
  }
  if (el.dataset.gi != null && S.V && S.V.g && S.V.kind==="bluff"){ const k = Number(el.dataset.gi), p = S.picks||[]; S.picks = p.includes(k) ? p.filter(x=>x!==k) : (p.length<4 ? p.concat(k) : p); render(); return; }
  if (el.dataset.gi != null){ const k = Number(el.dataset.gi); S.selected = S.selected===k ? null : k; render(); return; }
  if (el.dataset.ga){
    const m = {t:"ga", a:el.dataset.ga};
    if (el.dataset.suit != null) m.suit = Number(el.dataset.suit);
    if (el.dataset.col != null) m.col = Number(el.dataset.col);
    if (el.dataset.src) m.src = el.dataset.src;
    if (el.dataset.sel != null && S.selected != null){ m.k = S.selected; const gg = S.V && S.V.g; if (gg && gg.myHand) m.card = gg.myHand[S.selected]; }
    if (el.dataset.picks != null){ m.ks = (S.picks||[]).slice(); S.picks = []; }
    S.selected = null; act(m); render(); return;
  }
  if (el.dataset.emo){ act({t:"emo", e:el.dataset.emo}); return; }
  if (el.dataset.gt){ S.gameType = el.dataset.gt; lsSet("bs_gt", S.gameType); render(); return; }
  if (el.dataset.team != null){ act({t:"team", team:Number(el.dataset.team)}); return; }
  if (el.dataset.target){ S.targetN = Number(el.dataset.target); render(); return; }
  if (el.dataset.trump != null){ act({t:"trump", suit:Number(el.dataset.trump)}); return; }
  if (el.dataset.count){ S.setupN = Number(el.dataset.count); render(); return; }
  if (el.dataset.size){ CFG.size = el.dataset.size; saveCfg(); render(); return; }
  if (id==="create" || id==="join"){
    const name = $("#name").value.trim().slice(0,14);
    if (!name){ toast("Enter your name first."); $("#name").focus(); return; }
    S.name = name; lsSet("bs_name", name);
    if (typeof mqtt === "undefined"){ toast("Still loading the connection library. Try again in a moment."); return; }
    if (id==="create"){ S.setup = true; render(); }
    else {
      const code = $("#joincode").value.trim().toUpperCase();
      if (code.length !== 5){ toast("Room codes have 5 characters."); return; }
      S.pw = $("#joinpw").value;
      startGuest(name, code, false);
    }
  }
  else if (id==="createroom"){
    S.setup = false; S.pw = ($("#pw") ? $("#pw").value : S.pw) || "";
    startHost(S.name, {kind:S.gameType, target:(S.gameType==="bluff" ? ([1,2,3].includes(S.targetN)?S.targetN:2) : S.targetN), max:S.setupN});
  }
  else if (id==="setupback"){ S.setup = false; render(); }
  else if (id==="install"){ if (installPrompt){ installPrompt.prompt(); installPrompt = null; } }
  else if (id==="settings"){ S.settingsOpen = true; render(); }
  else if (id==="closesettings"){ S.settingsOpen = false; render(); }
  else if (id==="start" || id==="startnow") act({t:"start"});
  else if (id==="leave"){ if (S.V) confirmLeave(); else leave(); }
  else if (id==="leave2") confirmLeave();
  else if (id==="play"){
    const n = S.selected; S.selected = null;
    if (n!=null) act({t: S.V && S.V.kind==="court" ? "cplay" : "play", card:n});
    render();
  }
  else if (id==="pass") act({t:"pass"});
  else if (id==="scores"){ S.scoresOpen = true; render(); }
  else if (id==="closescores"){ S.scoresOpen = false; render(); }
  else if (id==="hide"){ S.dismissed = stageOf(S.V); render(); }
  else if (id==="emobtn"){ const b = $("#emobar"); b.hidden = !b.hidden; }
  else if (id==="nextgame") act({t:"next"});
  else if (id==="cdeal") act({t:"cdeal"});
  else if (id==="newmatch"){ S.scoresOpen = false; act({t:"newmatch"}); }
  else if (id==="cnewmatch"){ S.scoresOpen = false; act({t:"cnewmatch"}); }
  else if (id==="chatbtn") openChat(true);
  else if (id==="chatclose") openChat(false);
  else if (id==="send") sendText();
});
document.addEventListener("change", e=>{
  const id = e.target.id;
  if (id==="cfg-relay"){ lsSet("bs_relay", e.target.value.trim()); toast("Saved. It applies to rooms you create or join next."); return; }
  if (id==="pen") act({t:"penalty", v:Number(e.target.value)});
  else if (id==="cfg-hints"){ CFG.hints = e.target.checked; saveCfg(); render(); }
  else if (id==="cfg-vib"){ CFG.vibrate = e.target.checked; saveCfg(); if (CFG.vibrate && navigator.vibrate) navigator.vibrate(120); }
  else if (id==="cfg-snd"){ CFG.sound = e.target.checked; saveCfg(); if (CFG.sound) beep(); }
});
document.addEventListener("toggle", e=>{ if (e.target.id==="logbox") S.logOpen = e.target.open; }, true);
document.addEventListener("input", e=>{ if (e.target.id==="joincode") e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,""); });
document.addEventListener("keydown", e=>{ if (e.key==="Enter" && e.target.id==="chatinput") sendText(); });

/* ================= start ================= */
S.token = lsGet("bs_token") || newToken(); lsSet("bs_token", S.token);
S.name = lsGet("bs_name") || "";
S.gameType = GAME_INFO[lsGet("bs_gt")] ? lsGet("bs_gt") : "badam";
render(); drawChat();
window.mqttReady.then(ok=>{
  let framed = false; try{ framed = window.self !== window.top; }catch(e){ framed = true; }
  if (!ok){ toast("Could not load the connection library. Check your internet and reload."); return; }
  if (framed || !/^(https?:|file:)/.test(location.protocol)) toast("Open this page directly in Chrome or Safari. Previews inside other apps block connections.");
  // pick up where we left off after a reload, a Back press or a closed tab
  let sess = null; try{ sess = JSON.parse(lsGet("bs_sess")||"null"); }catch(e){}
  if (!sess || !sess.code || !sess.name) return;
  S.pw = sess.pw || "";
  if (sess.role === "host"){
    let saved = null; try{ saved = JSON.parse(lsGet("bs_host")||"null"); }catch(e){}
    if (saved && saved.code === sess.code && Date.now() - saved.t < 6*3600*1000) startHost(sess.name, {resume:saved});
    else lsSet("bs_sess", null);
  } else startGuest(sess.name, sess.code, true);
});
</script>
